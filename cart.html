<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Cart - GlowCare</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo">GlowCare</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="cart.html">Cart 🛒</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </nav>
  </header>

  <section>
    <h2>Your Shopping Cart</h2>
    <div id="cart-items" class="product-grid"></div>

    <div style="text-align: center; margin-top: 30px;">
      <h3>Total: ₹<span id="cart-total">0</span></h3>
      <a href="checkout.html" class="btn">Proceed to Checkout</a>
    </div>
  </section>

  <footer>
    &copy; 2025 GlowCare. All rights reserved.
  </footer>

  <script src="products.js"></script>
  <script>
    function renderCart() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const cartItems = document.getElementById('cart-items');
      const totalEl = document.getElementById('cart-total');
      cartItems.innerHTML = '';
      let total = 0;

      if (cart.length === 0) {
        cartItems.innerHTML = '<p style="text-align:center;">Your cart is empty!</p>';
        totalEl.textContent = 0;
        return;
      }

      cart.forEach((item, index) => {
        const subtotal = item.qty * item.price;
        total += subtotal;

        cartItems.innerHTML += `
          <div class="product-card">
            <img src="${item.image}" alt="${item.name}">
            <h3>${item.name}</h3>
            <p>Price: ₹${item.price}</p>
            <p>Quantity: 
              <button onclick="updateQty(${item.id}, -1)">-</button>
              ${item.qty}
              <button onclick="updateQty(${item.id}, 1)">+</button>
            </p>
            <p>Subtotal: ₹${subtotal}</p>
            <button onclick="removeItem(${item.id})" class="btn">Remove</button>
          </div>
        `;
      });

      totalEl.textContent = total;
    }

    function updateQty(id, change) {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      const item = cart.find(i => i.id === id);
      if (!item) return;

      item.qty += change;
      if (item.qty <= 0) {
        cart = cart.filter(i => i.id !== id);
      }
      localStorage.setItem('cart', JSON.stringify(cart));
      renderCart();
    }

    function removeItem(id) {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart = cart.filter(i => i.id !== id);
      localStorage.setItem('cart', JSON.stringify(cart));
      renderCart();
    }

    document.addEventListener('DOMContentLoaded', renderCart);
  </script>
</body>
</html>
