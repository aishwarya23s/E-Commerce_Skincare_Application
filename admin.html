<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Panel - GlowCare</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="margin: 0; padding: 0; background: linear-gradient(to right, #e0f7fa, #b2ebf2); height: 100vh; display: flex; flex-direction: column;">

  <header style="display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: white;">
    <div class="logo" style="font-weight: bold; font-size: 24px; color: #0D47A1;">GlowCare Admin</div>
    <nav>
      <ul style="list-style: none; display: flex; gap: 20px; margin: 0; padding: 0;">
        <li><a href="index.html">View Site</a></li>
        <li><a href="login.html">Logout</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main section for centering the form -->
  <main style="flex: 1; display: flex; justify-content: center; align-items: center;">
    <div style="background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); width: 350px; text-align: center;">
      <h2 style="color: #0D47A1;">Add New Product</h2>
      <form>
        <input type="text" placeholder="Product Name" required style="width: 90%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;"><br>
        <input type="number" placeholder="Price (₹)" required style="width: 90%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;"><br>
        <input type="url" placeholder="Image URL" required style="width: 90%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px;"><br>
        <button type="submit" style="padding: 10px 20px; background-color: #03A9F4; color: white; border: none; border-radius: 5px; cursor: pointer;">Add Product</button>
      </form>
    </div>
  </main>

  <footer style="text-align: center; padding: 15px; background-color: #81D4FA;">
    &copy; 2025 GlowCare. Admin Panel.
  </footer>

</body>

  <script>
    firebase.auth().onAuthStateChanged(user => {
  if (!user || user.email !== "aishwarya2310s@gmail.com") {
    alert("Access Denied");
    window.location.href = "login.html";
  }
});

    const form = document.getElementById("product-form");
    form.addEventListener("submit", function(e) {
      e.preventDefault();

      const name = document.getElementById("pname").value;
      const price = parseFloat(document.getElementById("pprice").value);
      const image = document.getElementById("pimage").value;

      const newProduct = {
        id: Date.now(),
        name,
        price,
        image
      };

      console.log("🆕 Product Added:", newProduct);

      // Optional: Save to localStorage
      let products = JSON.parse(localStorage.getItem("adminProducts")) || [];
      products.push(newProduct);
      localStorage.setItem("adminProducts", JSON.stringify(products));

      document.getElementById("admin-message").innerText = "✅ Product added (stored in localStorage)";
      form.reset();
    });
  </script>
</body>
</html>
